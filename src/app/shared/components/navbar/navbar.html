<header class="bg-slate-900/90 backdrop-blur-md text-white py-4 px-8 border-b border-slate-800 shadow-md flex justify-between items-center sticky top-0 z-50">
  <div class="flex items-center gap-3">
    <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-pink-500 flex items-center justify-center font-black text-white text-base">
      🅰️
    </div>
    <span class="text-lg font-black bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400 bg-clip-text text-transparent">
      Modern Angular Lab
    </span>
  </div>
  <nav class="flex gap-6 font-medium text-sm">
    <a routerLink="/" routerLinkActive="text-indigo-400 font-bold" [routerLinkActiveOptions]="{exact: true}" class="hover:text-indigo-300 transition">
      Home
    </a>
    <a routerLink="/about" routerLinkActive="text-indigo-400 font-bold" class="hover:text-indigo-300 transition">
      About
    </a>
  </nav>
</header>
