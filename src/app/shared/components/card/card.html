<div class="bg-slate-800 rounded-2xl p-6 shadow-lg border border-slate-700 hover:border-indigo-500 hover:shadow-indigo-500/10 transition-all duration-300 transform hover:-translate-y-1 flex flex-col justify-between h-full">
  <div>
    <div class="flex items-center justify-between mb-4">
      <span class="bg-indigo-950/70 text-indigo-300 border border-indigo-700/50 text-xs font-semibold px-3 py-1 rounded-full">
        {{ tag() }}
      </span>
    </div>
    <h3 class="text-xl font-bold text-white mb-2">
      {{ title() }}
    </h3>
    <p class="text-slate-400 text-sm leading-relaxed mb-6">
      {{ description() }}
    </p>
  </div>

  <button 
    (click)="onButtonClick()"
    class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white py-2 px-4 rounded-xl text-sm font-bold transition flex items-center justify-center gap-2">
    <span>Select Track</span> ✨
  </button>
</div>
